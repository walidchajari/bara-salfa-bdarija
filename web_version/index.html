<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>برا السالفة بالدارجة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --night:#120D1F;
  --raise:#1E1530;
  --card:#261C3A;
  --edge:#3A2860;
  --flame:#FF4500;
  --fire2:#FF8C00;
  --saffron:#FFC43D;
  --mint:#2EFFA8;
  --chalk:#F6EFE6;
  --dim:#9B8BBF;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--night);
  color:var(--chalk);
  font-family:'Cairo',system-ui,sans-serif;
  display:flex;justify-content:center;
  overscroll-behavior:none;
}
#app{
  width:100%;max-width:460px;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  position:relative;z-index:1;
}
.screen{flex:1;display:flex;flex-direction:column;gap:16px}
.spacer{flex:1}

/* ─── TYPOGRAPHY ─────────────────────────────────────────── */
h1{font-size:clamp(40px,13vw,62px);font-weight:900;line-height:1;letter-spacing:-1px}
h2{font-size:24px;font-weight:800;line-height:1.2}
h3{font-size:18px;font-weight:700}
p{font-size:15px;line-height:1.7;color:var(--dim)}
.lead{color:var(--chalk)}
.sm{font-size:13px}

/* ─── DECORATIONS ────────────────────────────────────────── */
.zig{
  height:9px;
  background-image:
    linear-gradient(135deg,var(--flame) 25%,transparent 25%),
    linear-gradient(225deg,var(--flame) 25%,transparent 25%);
  background-size:16px 9px;
  border-radius:3px;opacity:.6;
}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);font-weight:700}
.bar b{color:var(--saffron);font-weight:900}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 12px;border-radius:99px;
  background:var(--edge);color:var(--saffron);
}

/* ─── BUTTONS ────────────────────────────────────────────── */
button{
  font-family:inherit;font-size:17px;font-weight:800;
  border:0;border-radius:var(--r);padding:16px 20px;
  cursor:pointer;width:100%;
  transition:transform .1s,box-shadow .1s;
  position:relative;overflow:hidden;
}
button::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 60%);
  pointer-events:none;
}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
button[disabled]{opacity:.3;cursor:not-allowed;transform:none}

.btn-primary{
  background:linear-gradient(135deg,var(--flame),var(--fire2));
  color:#fff;
  box-shadow:0 6px 24px rgba(255,69,0,.45);
}
.btn-cta{
  background:linear-gradient(135deg,var(--saffron),#FFB300);
  color:#120D1F;
  box-shadow:0 6px 24px rgba(255,196,61,.4);
  font-size:19px;
  padding:19px 20px;
}
.btn-ghost{
  background:transparent;color:var(--chalk);
  border:2px solid var(--edge);
}
.btn-ghost:hover{border-color:var(--dim)}
.btn-sm{font-size:14px;padding:11px 14px}
.row{display:flex;gap:10px}
.row button{flex:1}

/* ─── INPUTS ─────────────────────────────────────────────── */
input{
  width:100%;font-family:inherit;font-size:17px;font-weight:700;
  padding:14px 16px;border-radius:14px;
  border:2px solid var(--edge);
  background:var(--card);color:var(--chalk);
  transition:border-color .15s;
}
input:focus{outline:0;border-color:var(--saffron)}
input::placeholder{color:var(--dim);font-weight:600}

/* ─── CARDS / PICKS ──────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--edge);
  border-radius:var(--r);padding:18px;
}
.pick{
  width:100%;text-align:right;
  background:var(--card);border:2px solid var(--edge);
  border-radius:14px;padding:14px 16px;
  color:var(--chalk);font-size:16px;font-weight:700;
  cursor:pointer;transition:border-color .15s,background .15s;
  margin-bottom:8px;
}
.pick:hover{border-color:var(--dim)}
.pick.on{border-color:var(--saffron);background:rgba(255,196,61,.08)}
.pick .sub{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:3px}

/* ─── HOLD-TO-REVEAL ─────────────────────────────────────── */
.hold{
  position:relative;flex:1;min-height:280px;
  border-radius:26px;border:2px dashed var(--edge);
  background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:26px;
  touch-action:none;user-select:none;
  transition:border-color .25s,background .25s;
}
.hold.live{border-style:solid;border-color:var(--flame);background:rgba(255,69,0,.07)}
.hold .hint{font-size:15px;font-weight:700;color:var(--dim)}
.ring{
  width:88px;height:88px;border-radius:50%;
  background:conic-gradient(var(--flame) calc(var(--p)*1%),var(--edge) 0);
  display:grid;place-items:center;
  transition:none;
}
.ring-inner{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px}
.secret{display:none}
.hold.live .secret{display:block}
.hold.live .veil{display:none}
.role-badge{
  font-size:13px;font-weight:900;letter-spacing:1.5px;
  padding:5px 14px;border-radius:99px;margin-bottom:4px;
  display:inline-block;
}
.role-intrus{background:rgba(255,69,0,.2);color:var(--flame)}
.role-safe{background:rgba(46,255,168,.12);color:var(--mint)}
.word-reveal{font-size:clamp(36px,11vw,52px);font-weight:900;margin:6px 0 10px;line-height:1.1}
.mission-txt{font-size:15px;font-weight:700;color:var(--saffron);line-height:1.6;
  background:rgba(255,196,61,.08);border:1px solid rgba(255,196,61,.2);
  border-radius:12px;padding:12px;margin-top:8px}

/* ─── TABLE ──────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
td{padding:12px 4px;border-bottom:1px solid var(--edge);font-weight:700;font-size:16px}
td.pts{text-align:left;color:var(--saffron);font-weight:900;font-variant-numeric:tabular-nums;font-size:18px}
tr.winner td:first-child::before{content:'🥇 '}
tr.me td{color:var(--flame)}

/* ─── ANIMATIONS ─────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes glow{0%,100%{box-shadow:0 0 12px rgba(255,69,0,.3)}50%{box-shadow:0 0 28px rgba(255,69,0,.7)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes countPulse{0%{transform:scale(1)}50%{transform:scale(1.35);color:var(--flame)}100%{transform:scale(1)}}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  30%{transform:translate(-28px,22px) scale(1.07)}
  70%{transform:translate(20px,-16px) scale(.93)}
}
@keyframes badgePulse{
  0%,100%{box-shadow:0 4px 20px rgba(255,69,0,.45)}
  50%{box-shadow:0 4px 34px rgba(255,140,0,.75),0 0 60px rgba(255,69,0,.2)}
}
@keyframes titleGlow{
  0%,100%{filter:drop-shadow(0 0 20px rgba(255,196,61,.25))}
  50%{filter:drop-shadow(0 0 40px rgba(255,196,61,.55))}
}

.anim-fadeup{animation:fadeUp .4s ease both}
.anim-pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.anim-shake{animation:shake .5s ease}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}

/* ─── HOME SCREEN ────────────────────────────────────────── */
.home-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
.home-bg span{
  position:absolute;
  animation:float 3s ease-in-out infinite;
  opacity:.1;
}
/* orbs */
.home-orb{position:absolute;border-radius:50%;pointer-events:none}
.home-orb-1{
  width:380px;height:380px;
  background:radial-gradient(circle,rgba(255,69,0,.42) 0%,transparent 68%);
  top:-110px;right:-110px;
  animation:orbFloat 9s ease-in-out infinite;
  filter:blur(55px);
}
.home-orb-2{
  width:280px;height:280px;
  background:radial-gradient(circle,rgba(255,196,61,.32) 0%,transparent 68%);
  bottom:60px;left:-90px;
  animation:orbFloat 12s ease-in-out infinite reverse;
  filter:blur(48px);
}
.home-orb-3{
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(46,255,168,.18) 0%,transparent 68%);
  top:42%;right:-50px;
  animation:orbFloat 8s ease-in-out infinite 2s;
  filter:blur(42px);
}
/* mascot */
.home-mascot-wrap{
  position:relative;display:inline-block;
  margin-bottom:6px;
}
.home-mascot-ring{
  position:absolute;inset:-16px;border-radius:50%;
  background:conic-gradient(
    var(--flame) 0%,var(--saffron) 28%,var(--mint) 52%,#a78bfa 76%,var(--flame) 100%
  );
  opacity:.45;filter:blur(6px);
  animation:spin 6s linear infinite;
}
.home-mascot-emoji{
  font-size:82px;display:block;
  animation:float 3.2s ease-in-out infinite;
  position:relative;z-index:1;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));
}
/* title — two stacked lines */
.home-title-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;
  animation:titleGlow 4s ease-in-out infinite;
}
/* "برا" — flame pill */
.home-title-bara{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:clamp(38px,11.5vw,58px);
  font-weight:900;
  letter-spacing:10px;
  text-indent:10px; /* compensate letter-spacing on last char */
  line-height:1;
  padding:6px 28px 10px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--flame) 0%,var(--fire2) 50%,var(--saffron) 100%);
  color:#fff;
  box-shadow:
    0 6px 28px rgba(255,69,0,.55),
    0 0 60px rgba(255,140,0,.2),
    inset 0 1px 0 rgba(255,255,255,.18);
  position:relative;
}
/* fire underline accent */
.home-title-bara::after{
  content:'';
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:40%;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--flame),transparent);
  opacity:.7;
}
/* "السالفة" — big hero gradient */
.home-title-salfa{
  display:block;
  font-size:clamp(62px,18.5vw,92px);
  font-weight:900;letter-spacing:-3px;line-height:.88;
  background:linear-gradient(140deg,#ffffff 0%,#ffffff 22%,var(--saffron) 55%,var(--flame) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-top:6px;
}
/* "بالدارجة" badge */
.home-darija-badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:clamp(11px,3.2vw,15px);font-weight:900;
  letter-spacing:2px;text-transform:uppercase;
  padding:7px 22px;border-radius:99px;
  background:linear-gradient(135deg,var(--flame),var(--fire2));
  color:#fff;
  animation:badgePulse 3s ease-in-out infinite;
  margin-top:14px;
}
/* tagline */
.home-tagline{
  font-size:clamp(13px,3.8vw,16px);
  color:var(--dim);font-weight:600;margin-top:12px;letter-spacing:.2px;
}
/* feature chips */
.home-feats{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
}
.home-feat{
  background:var(--card);
  border:1px solid var(--edge);
  border-radius:18px;padding:16px 6px 14px;
  text-align:center;
  transition:border-color .2s,transform .15s;
}
.home-feat:active{transform:scale(.97)}
.home-feat-ico{font-size:26px;display:block;margin-bottom:6px}
.home-feat-lbl{
  font-size:11px;font-weight:800;
  color:var(--dim);line-height:1.4;display:block;
}

/* ─── HOW-TO ─────────────────────────────────────────────── */
.step{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--card);border-radius:14px;padding:14px;
}
.step-num{
  min-width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--flame),var(--fire2));
  display:grid;place-items:center;
  font-size:15px;font-weight:900;color:#fff;flex-shrink:0;
}

/* ─── TIMER ──────────────────────────────────────────────── */
.clock-big{
  font-size:clamp(72px,22vw,100px);font-weight:900;
  text-align:center;font-variant-numeric:tabular-nums;
  transition:color .3s;
}
.clock-big.low{color:var(--flame);animation:pulse 1s infinite}
.clock-sm{font-size:15px;font-variant-numeric:tabular-nums;color:var(--dim)}
.clock-sm.low{color:var(--flame);font-weight:800}

/* ─── RESULT ─────────────────────────────────────────────── */
.result-banner{
  border-radius:22px;padding:24px;text-align:center;
  border:2px solid;
}
.result-caught{background:rgba(46,255,168,.07);border-color:var(--mint)}
.result-escaped{background:rgba(255,69,0,.07);border-color:var(--flame)}

/* ─── FOOTBALL THEME ────────────────────────────────────── */
.football-edition{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:900;letter-spacing:.5px;
  padding:4px 12px;border-radius:99px;margin-bottom:6px;
  background:rgba(27,107,46,.25);color:#4CAF50;
  border:1px solid rgba(76,175,80,.35);
}
.word-football{color:#4CAF50;text-shadow:0 2px 14px rgba(76,175,80,.35)}
.word-outsider-football{
  color:var(--flame);
  font-size:clamp(26px,7vw,38px)!important;
  line-height:1.25;
}
.football-cat-btn{border-color:rgba(76,175,80,.35)!important}
.football-cat-btn.on{border-color:#4CAF50!important;background:rgba(76,175,80,.1)!important}

/* ─── CONFETTI ───────────────────────────────────────────── */
.confetti-piece{
  position:fixed;top:-20px;
  width:10px;height:14px;border-radius:3px;
  pointer-events:none;z-index:9999;
  animation:confettiFall linear both;
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── CATEGORY GRID ─────────────────────────────────────── */
.cat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.cat-grid .cat-all{
  grid-column:1/-1;
}
.cat-card{
  width:100%;text-align:center;
  background:var(--card);border:2px solid var(--edge);
  border-radius:16px;padding:16px 10px;
  color:var(--chalk);font-size:14px;font-weight:800;
  cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  line-height:1.3;
}
.cat-card:active{transform:scale(.97)}
.cat-card:hover{border-color:var(--dim)}
.cat-card.on{border-color:var(--saffron);background:rgba(255,196,61,.08)}
.cat-card .cat-emoji{font-size:32px;line-height:1}
.cat-card .cat-count{
  font-size:11px;font-weight:600;color:var(--dim);
  background:var(--edge);border-radius:99px;
  padding:2px 8px;margin-top:2px;
}
.cat-card.football-card.on{border-color:#4CAF50;background:rgba(76,175,80,.08)}
.cat-card.football-card .cat-count{color:#4CAF50}
.cat-all-card{
  width:100%;text-align:center;
  background:linear-gradient(135deg,rgba(255,69,0,.1),rgba(255,196,61,.1));
  border:2px solid var(--edge);
  border-radius:16px;padding:14px;
  color:var(--chalk);font-size:15px;font-weight:800;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.cat-all-card:active{transform:scale(.98)}
.cat-all-card.on{border-color:var(--saffron);background:rgba(255,196,61,.1)}
.cat-all-card .cat-all-sub{font-size:12px;font-weight:600;color:var(--dim);margin-right:4px}

/* ─── LOCKED CARD ───────────────────────────────────────── */
.pick-locked{
  width:100%;text-align:right;
  background:rgba(30,21,48,.5);border:2px dashed var(--edge);
  border-radius:14px;padding:14px 16px;
  color:var(--dim);font-size:16px;font-weight:700;
  cursor:not-allowed;margin-bottom:8px;
  position:relative;overflow:hidden;
}
.pick-locked .sub{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:3px}
.soon-badge{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:900;letter-spacing:.5px;
  padding:3px 10px;border-radius:99px;
  background:rgba(155,139,191,.15);color:var(--dim);border:1px solid var(--edge);
}

/* ─── PROGRESS BAR ──────────────────────────────────────── */
.prog-bar{
  height:4px;border-radius:2px;background:var(--edge);
  overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--flame),var(--saffron));
  transition:width .3s;
}

/* ─── TIE NOTICE ─────────────────────────────────────────── */
.tie-notice{
  background:rgba(255,196,61,.08);border:1px solid rgba(255,196,61,.3);
  border-radius:14px;padding:14px;text-align:center;
}

/* ─── QUIT BUTTON ────────────────────────────────────────── */
.quit-btn{
  position:fixed;top:14px;left:14px;
  width:34px;height:34px;padding:0;
  border-radius:50%;
  background:rgba(30,21,48,.75);
  border:1.5px solid var(--edge);
  color:var(--dim);font-size:15px;
  display:grid;place-items:center;
  z-index:100;cursor:pointer;
  backdrop-filter:blur(6px);
  transition:color .15s,border-color .15s;
  font-family:inherit;width:34px;
}
.quit-btn:hover{color:var(--chalk);border-color:var(--dim)}
.quit-btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

/* ─── MODAL ──────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(18,13,31,.88);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  backdrop-filter:blur(5px);
  animation:fadeIn .2s ease both;
}
.modal-overlay[hidden]{display:none}
.modal-box{
  background:var(--raise);
  border:1px solid var(--edge);
  border-radius:22px;
  padding:28px 22px;
  width:100%;max-width:360px;
  text-align:center;
}
.modal-box h2{font-size:20px;margin-bottom:10px;color:var(--chalk)}
.modal-box p{font-size:14px;margin-bottom:22px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<div class="home-bg" id="homeBg"></div>
<div id="app"></div>

<button id="quit-btn" class="quit-btn" onclick="act.showQuitModal()" aria-label="خروج من اللعبة" hidden>✕</button>

<div id="quit-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="quit-title">
  <div class="modal-box">
    <h2 id="quit-title">بغيتي تخرج من اللعبة؟</h2>
    <p>غادي تضيع التقدم ديال الجولة الحالية.</p>
    <div class="row">
      <button class="btn-ghost" onclick="act.hideQuitModal()">لا، كمّل اللعب</button>
      <button class="btn-primary" onclick="act.confirmQuit()">إيه، خرج</button>
    </div>
  </div>
</div>
<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   CONTENU — MOTS EN DARIJA
══════════════════════════════════════════════════════════ */

const CATS = [
/* ── 1. الشباب ───────────────────────────────────────────── */
{id:'youth', n:'🔥 الشباب', w:[
  ['الكراش','الإعجاب',['كراش','الكراش']],
  ['الحب','الكراش',['حب','الحب']],

const norm = s => (s||'').toString().trim().toLowerCase()
  .replace(/[ً-ْـ]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .replace(/^ال/,'').replace(/\s+/g,' ');

const pick   = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => {
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
};
const fmt = s => Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════════════════════════════════════════════════════
   ENGINE
══════════════════════════════════════════════════════════ */
function chooseIntrus(){
  const recent = S.intrusHistory.slice(-2);
  let pool = S.players.filter(p=>!recent.includes(p));
  if(!pool.length) pool = S.players.filter(p=>p!==S.intrusHistory.slice(-1)[0]);
  if(!pool.length) pool = [...S.players];
  return pick(pool);
}

function drawChaos(){
  const last2 = S.chaosHistory.slice(-2);
  let pool = CHAOS.filter(c=>!c.mp||S.players.length>=c.mp);
  if(last2.length===2 && last2.every(b=>b==='intrus')) pool = pool.filter(c=>c.b!=='intrus');
  const c = pick(pool);
  S.chaosHistory.push(c.b);
  return c;
}

function newRound(){
  const cat = CATS.find(c=>c.id===S.catId) || pick(CATS);
  const entry = pick(cat.w);
  const [word, close, ok] = entry;
  const intrus = chooseIntrus();
  S.intrusHistory.push(intrus);

  const trio = S.players.length === 3;
  const closeMode = trio ? true : (S.mode!=='classic' && Math.random()<.55);
  const chaos = (S.mode==='hybrid') ? drawChaos() : null;

  let missions = {};
  if(S.mode==='hybrid' && !trio){
    const avail = shuffle(MISSIONS.filter(m=>!chaos||!m.c.includes(chaos.id)));
    S.players.forEach((p,i) => missions[p] = avail[i%avail.length]);
  }

  S.r = {
    cat:cat.n, word, close, ok, intrus, closeMode, chaos, missions, trio,
    football:!!cat.football,
    asker:pick(S.players), lastAsker:null, turns:0, asked:{},
    votes:{}, caught:false, guess:null, judged:{}, tied:[],
  };
  S.idx = 0; S.tieRound = false;
  S.round++;
}

function tallyVotes(votes){
  const t={};
  S.players.forEach(p=>t[p]=0);
  Object.values(votes).forEach(v=>t[v]++);
  const max = Math.max(...Object.values(t));
  return {t, top:S.players.filter(p=>t[p]===max), max};
}

function calcScore(){
  const r=S.r, add={};
  S.players.forEach(p=>add[p]=0);
  // 1pt per regular player who voted correctly
  S.players.filter(p=>p!==r.intrus).forEach(p=>{
    if(r.votes[p]===r.intrus) add[p]=1;
  });
  // 1pt for intrus if they guess correctly (regardless of caught)
  if(r.guess===true) add[r.intrus]=1;
  // Hybrid missions: +1 bonus per completed mission
  Object.entries(r.judged||{}).forEach(([p,ok])=>{ if(ok) add[p]+=1; });
  S.players.forEach(p=>S.scores[p]=(S.scores[p]||0)+add[p]);
  return add;
}

function confetti(count=60){
  const colors=['#FF4500','#FFC43D','#2EFFA8','#FF69B4','#00BFFF','#FFD700'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`
      left:${Math.random()*100}vw;
      background:${pick(colors)};
      width:${6+Math.random()*10}px;
      height:${10+Math.random()*10}px;
      border-radius:${Math.random()>0.5?'50%':'3px'};
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*.8}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

let clk=null;
function startClock(sec){
  stopClock(); S.clockLeft=sec; S.clockDone=false;
  const paint=()=>{
    const el=document.getElementById('clock-el'); if(!el)return;
    el.textContent=fmt(S.clockLeft);
    el.className='clock-sm'+(S.clockLeft<=20?' low':'');
  };
  paint();
  clk=setInterval(()=>{
    S.clockLeft--;
    if(S.clockLeft<=0){S.clockLeft=0;S.clockDone=true;stopClock();render();return;}
    paint();
  },1000);
}
function stopClock(){clearInterval(clk);clk=null;}

  <div class="spacer"></div>
  <div class="row">
    <button class="btn-ghost" onclick="act.judge(false)">❌ لا</button>
    <button class="btn-cta" onclick="act.judge(true)">✅ إيه، دارها</button>
  </div>`;
},

/* ── BONUS GUESS ───────────────────────────────────────────── */
bonus: ()=>{
  const r=S.r;
  if(!r.bonusChoices){
    const cat=CATS.find(c=>c.id===S.catId)||CATS.find(c=>c.n===r.cat);
    const all=cat?cat.w.map(e=>e[0]):[r.word];
    const others=shuffle(all.filter(w=>w!==r.word)).slice(0,4);
    r.bonusChoices=shuffle([r.word,...others]);
  }
  const status=r.caught
    ?`${esc(r.intrus)}، تصابتي 😅 — عندك فرصة أخيرة!`
    :`${esc(r.intrus)}، فلتي 😎 — خمن الكلمة!`;
  return `
  ${hdr()}
  <div style="text-align:center" class="anim-pop">
    <div style="font-size:48px">🎯</div>
    <span class="tag" style="margin:8px 0;display:inline-block">فرصة أخيرة</span>
    <h2 style="margin-top:10px">${status}</h2>
    <p class="lead" style="margin-top:6px">اختار الكلمة السرية — إلا صبت كتربح نقطة!</p>
  </div>
  ${r.bonusChoices.map((w,i)=>`
    <button class="pick anim-fadeup" onclick="act.guessChoice(${i})">${esc(w)}</button>
  `).join('')}
  <button class="btn-ghost btn-sm" onclick="act.skipGuess()">ما عرفتش 😔</button>`;
},

/* ── RESULT ────────────────────────────────────────────────── */
result: ()=>{
  const r=S.r, add=r.add, caught=r.caught;
  const allRows=S.players.map(p=>{
    const isIntrus=p===r.intrus;
    const votedFor=r.votes[p]||'—';
    const correct=!isIntrus&&r.votes[p]===r.intrus;
    return `<tr class="${isIntrus?'me':''}">
      <td>
        ${isIntrus?'🕵️ ':''}${esc(p)}
      </td>
      <td style="font-size:12px;color:var(--dim)">
        ${isIntrus
          ? (r.guess===true?'<span style="color:var(--mint)">خمن ✅</span>':r.guess===false?'<span style="color:var(--dim)">ما خمنش</span>':'')
          : `← ${esc(votedFor)} ${correct?'<span style="color:var(--mint)">✅</span>':'<span style="color:var(--dim)">❌</span>'}`
        }
      </td>
      <td class="pts">+${add[p]}</td>
    </tr>`;
  }).join('');
  return `
  ${hdr()}
  <div class="result-banner ${caught?'result-caught':'result-escaped'} anim-pop">
    <div style="font-size:52px">${caught?'🎉':'😈'}</div>
    <h1 style="font-size:40px;color:${caught?'var(--mint)':'var(--flame)'};margin:6px 0">
      ${caught?'تصاب برا السالفة!':'فلت برا السالفة!'}
    </h1>
    <p class="lead" style="font-size:15px;margin-top:4px">
      برا السالفة: <b style="color:var(--saffron)">${esc(r.intrus)}</b>
    </p>
    <p class="lead" style="font-size:15px">
      الكلمة السرية: <b style="color:var(--saffron)">${esc(r.word)}</b>
    </p>
  </div>
  <h3 class="anim-fadeup d1" style="font-size:14px;color:var(--dim);margin-top:4px">النتائج</h3>
  <table class="anim-fadeup d2">
    ${allRows}
  </table>
  <div class="spacer"></div>
  <button class="btn-cta anim-fadeup d3" onclick="act.board()">شوف النقاط الكاملة 📊</button>`;
},

/* ── SCOREBOARD ────────────────────────────────────────────── */
board: ()=>{
  const sorted=[...S.players].sort((a,b)=>S.scores[b]-S.scores[a]);
  const done=S.round>=ROUNDS;
  const roundProg=Math.round((S.round/ROUNDS)*100);
  if(done) confetti(80);
  return `
  <div class="bar anim-fadeup">
    <span>${done?'🏆 النتيجة النهائية':'📊 النقاط'}</span>
    <span>جولة <b>${S.round}</b> / <b>${ROUNDS}</b></span>
  </div>
  <div class="zig"></div>
  ${!done?`
  <div class="prog-bar anim-fadeup">
    <div class="prog-fill" style="width:${roundProg}%"></div>
  </div>`:''}
  ${done?`
  <div style="text-align:center" class="anim-pop">
    <div style="font-size:52px">🏆</div>
    <h1 style="font-size:32px;margin:6px 0">
      ${esc(sorted[0])} ربح!
    </h1>
    <p class="sm" style="color:var(--dim)">بـ ${S.scores[sorted[0]]} نقطة</p>
  </div>`:''}
  <table class="anim-fadeup d2">
    ${sorted.map((p,i)=>`
    <tr class="${i===0&&done?'winner':''}">
      <td style="font-size:18px">${['🥇','🥈','🥉'][i]||'　'} ${esc(p)}</td>
      <td class="pts">${S.scores[p]} نقطة</td>
    </tr>`).join('')}
  </table>
  <div class="spacer"></div>
  ${done?`
  <button class="btn-cta anim-fadeup d3" onclick="act.newGame()">🎲 لعبة جديدة</button>
  <button class="btn-primary anim-fadeup d4" onclick="act.again()">🔄 نفس اللاعبين — عاود</button>
  <button class="btn-ghost anim-fadeup d5" onclick="go('home')">🏠 الصفحة الرئيسية</button>`
  :`
  <button class="btn-cta anim-fadeup d3" onclick="act.start()">الجولة اللي جاية ⚡</button>
  <button class="btn-ghost anim-fadeup d4" onclick="act.showQuitModal()">🚪 خروج من اللعبة</button>`}`;
},
}; // end VIEWS

/* ══════════════════════════════════════════════════════════
   QUIT MODAL
══════════════════════════════════════════════════════════ */
act.showQuitModal = ()=>{
  const m = document.getElementById('quit-modal');
  m.hidden = false;
  m.querySelector('button').focus();
};
act.hideQuitModal = ()=>{ document.getElementById('quit-modal').hidden = true; };
act.confirmQuit = ()=>{
  stopClock();
  act.hideQuitModal();
  S.phase='home'; S.players=[]; S.mode='classic'; S.catId=null;
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[]; S.scores={};
  S.r=null; S.idx=0; S.tieRound=false; S.clockLeft=0; S.clockDone=false;
  render();
};

/* ══════════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════════ */
act.setup = ()=>{ if(!S.players.length) S.players=['','',''];  go('setup'); };
act.more  = ()=>{ const c=grab(); if(c.length<8){S.players=[...c,'']; render();} };
act.less  = ()=>{ const c=grab(); if(c.length>3){S.players=c.slice(0,-1); render();} };

function grab(){ return Array.from(app.querySelectorAll('#names input')).map(i=>i.value); }

act.names = ()=>{
  const v = grab().map((s,i)=>s.trim()||`لاعب ${i+1}`);
  if(new Set(v).size!==v.length){
    S.nameError='السميات خاصهم يكونو مختلفين 😅'; render(); return;
  }
  S.nameError='';
  S.players=v; S.players.forEach(p=>S.scores[p]=0); go('config');
};
act.mode = m  => { S.mode=m; render(); };
act.cat  = c  => { S.catId=c; render(); };

act.start = ()=>{
  if(S.round>=ROUNDS){ act.again(); return; }
  newRound(); go('pass');
};

act.toReveal  = ()=>{ go('reveal'); bindHold(); };
act.nextReveal = ()=>{
  S.idx++;
  if(S.idx<S.players.length){ go('pass'); }
  else{ S.idx=0; S.r.chaos ? go('chaos') : act.discuss(); }
};
act.discuss = ()=>{ go('chain'); startClock(S.r.trio?180:240); };
act.ask = i =>{
  const target=S.players[i], r=S.r;
  r.asked[target]=(r.asked[target]||0)+1;
  r.lastAsker=r.asker; r.asker=target; r.turns++;
  render();
};
act.toVote = ()=>{ stopClock(); S.idx=0; S.r.votes={}; go('votepass'); };
act.toCast = ()=> go('cast');
act.vote = i =>{
  if(i>=0) S.r.votes[S.players[S.idx]]=S.players[i];
  S.idx++;
  if(S.idx<S.players.length){ go('votepass'); return; }
  finishVote();
};

function finishVote(){
  if(S.r.trio){
    const inn = S.players.filter(p=>p!==S.r.intrus);
    S.r.caught = inn.every(p=>S.r.votes[p]===S.r.intrus);
    S.idx=0; afterJudge(); return;
  }
  const {top} = tallyVotes(S.r.votes);
  if(top.length>1 && !S.tieRound){
    S.r.tied=top; S.tieRound=true; S.idx=0; S.r.votes={};
    go('votepass'); return;
  }
  S.r.caught = top.length===1 && top[0]===S.r.intrus;
  S.idx=0;
  const hasMissions = Object.keys(S.r.missions||{}).length>0;
  if(hasMissions) go('judge'); else afterJudge();
}

act.judge = ok =>{
  S.r.judged[S.players[S.idx]]=ok;
  S.idx++;
  if(S.idx<S.players.length) go('judge'); else afterJudge();
};
function afterJudge(){ go('bonus'); }

act.guessChoice = i=>{
  const w=S.r.bonusChoices[i];
  S.r.guess=norm(w)===norm(S.r.word);
  finish();
};
act.skipGuess = ()=>{ S.r.guess=false; finish(); };

function finish(){ S.r.add=calcScore(); go('result'); }
act.board = ()=> go('board');
act.again = ()=>{
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[];
  S.players.forEach(p=>S.scores[p]=0);
  go('config');
};
act.newGame = ()=>{
  stopClock();
  S.phase='home'; S.players=[]; S.mode='classic'; S.catId=null;
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[]; S.scores={};
  S.r=null; S.idx=0; S.tieRound=false; S.clockLeft=0; S.clockDone=false;
  render();
};

/* ══════════════════════════════════════════════════════════
   HOLD TO REVEAL
══════════════════════════════════════════════════════════ */
function bindHold(){
  const el=document.getElementById('hold'); if(!el) return;
  let t=null, p=0;
  const up = ()=>{
    clearInterval(t); p=0;
    el.style.setProperty('--p',0);
    el.classList.remove('live');
    const ri=document.getElementById('ring');
    if(ri) ri.querySelector('.ring-inner').textContent='🔒';
  };
  const down = e=>{
    e.preventDefault(); clearInterval(t);
    t=setInterval(()=>{
      p=Math.min(100,p+16);
      el.style.setProperty('--p',p);
      const ri=document.getElementById('ring');
      if(ri) ri.querySelector('.ring-inner').textContent=p>=100?'👁️':'🔓';
      if(p>=100) el.classList.add('live');
    },40);
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !document.getElementById('quit-modal').hidden) act.hideQuitModal();
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden && S.phase==='reveal'){
    const el=document.getElementById('hold');
    if(el){ el.classList.remove('live'); el.style.setProperty('--p',0); }
  }
});

/* ══════════════════════════════════════════════════════════
   UNIT TESTS
   Auto-runs on load. Run manually: runGameTests()
══════════════════════════════════════════════════════════ */
function runGameTests(){
  const failures=[];
  const assert=(name,cond,detail='')=>{if(!cond)failures.push(name+(detail?': '+detail:''));};

  const sv={
    players:[...S.players],catId:S.catId,mode:S.mode,round:S.round,
    intrusHistory:[...S.intrusHistory],chaosHistory:[...S.chaosHistory],
    scores:{...S.scores},r:S.r
  };

  const restore=()=>{
    S.players=sv.players;S.catId=sv.catId;S.mode=sv.mode;S.round=sv.round;
    S.intrusHistory=sv.intrusHistory;S.chaosHistory=sv.chaosHistory;
    S.scores=sv.scores;S.r=sv.r;
  };

  /* ── SUITE 1: intrus selection & role reveal ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;
  S.intrusHistory=[];S.chaosHistory=[];
  const ITER=40;
  for(let i=0;i<ITER;i++){
    newRound();
    const r=S.r;
    /* exactly one intrus */
    assert('[r'+i+'] one intrus',S.players.filter(p=>p===r.intrus).length===1);
    /* intrus is a known player */
    assert('[r'+i+'] intrus is valid player',S.players.includes(r.intrus));
    /* intrus sees "نتا برا السالفة" — simulate reveal logic */
    const intrusSees='نتا برا السالفة';
    assert('[r'+i+'] intrus reveal is static',intrusSees==='نتا برا السالفة');
    /* intrus does NOT see the word */
    assert('[r'+i+'] intrus cannot see word',intrusSees!==r.word,'leaked: '+r.word);
    /* regular players see r.word */
    const regWord=r.word;
    assert('[r'+i+'] regular player sees word',typeof regWord==='string'&&regWord.length>0);
    /* word is from the selected category */
    const cat=CATS.find(c=>c.id===S.catId)||CATS.find(c=>c.n===r.cat)||CATS[0];
    assert('[r'+i+'] word in category',cat.w.map(e=>e[0]).includes(r.word),'word='+r.word);
  }

  /* ── SUITE 2: intrus anti-repeat ── */
  S.players=['Ali','Omar','Sara','Ahmed','Karim'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  const intruses=[];
  for(let i=0;i<20;i++){newRound();intruses.push(S.r.intrus);}
  /* same player cannot be intrus 3 consecutive times */
  for(let i=2;i<intruses.length;i++){
    assert('[anti-repeat '+i+']',
      !(intruses[i]===intruses[i-1]&&intruses[i]===intruses[i-2]),
      intruses[i]+' was intrus 3x in a row');
  }

  /* ── SUITE 3: voting — cannot vote for self ── */
  S.players=['Ali','Omar','Sara'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  newRound();
  /* cast view should filter out self — simulate cast view pool for each player */
  S.players.forEach(me=>{
    const pool=S.players.filter(p=>p!==me);
    assert('[no-self-vote] '+me+' cannot vote for self',!pool.includes(me));
    assert('[no-self-vote] '+me+' has others to vote for',pool.length>0);
  });

  /* ── SUITE 4: scoring — 1pt correct vote, 1pt correct guess ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  newRound();
  const ri=S.r.intrus;
  const nonIntrus=S.players.filter(p=>p!==ri);
  /* all non-intrus vote correctly */
  nonIntrus.forEach(p=>S.r.votes[p]=ri);
  S.r.votes[ri]=nonIntrus[0];
  S.r.caught=true;S.r.guess=true;S.r.judged={};
  const add=calcScore();
  nonIntrus.forEach(p=>assert('[score] '+p+' correct vote = 1',add[p]===1,'got '+add[p]));
  assert('[score] intrus correct guess = 1',add[ri]===1,'got '+add[ri]);
  /* reset scores and test wrong vote */
  S.players.forEach(p=>S.scores[p]=0);
  newRound();
  const ri2=S.r.intrus, ni2=S.players.filter(p=>p!==ri2);
  ni2.forEach(p=>S.r.votes[p]=ni2[0]||p); // vote for non-intrus
  S.r.caught=false;S.r.guess=false;S.r.judged={};
  const add2=calcScore();
  ni2.forEach(p=>assert('[score] wrong vote = 0',add2[p]===0,'got '+add2[p]));
  assert('[score] intrus wrong guess = 0',add2[ri2]===0,'got '+add2[ri2]);

  /* ── SUITE 5: bonus choices ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId='football';S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  newRound();
  const footballCat=CATS.find(c=>c.id==='football');
  const validWords=footballCat.w.map(e=>e[0]);
  /* simulate bonus choices generation */
  const all=footballCat.w.map(e=>e[0]);
  const others=shuffle(all.filter(w=>w!==S.r.word)).slice(0,4);
  const choices=shuffle([S.r.word,...others]);
  assert('[bonus] correct word in choices',choices.includes(S.r.word));
  assert('[bonus] choices count >=2',choices.length>=2,'got '+choices.length);
  assert('[bonus] choices count <=5',choices.length<=5,'got '+choices.length);
  assert('[bonus] all choices from category',choices.every(w=>validWords.includes(w)));
  /* correct selection returns guess=true */
  const correctIdx=choices.indexOf(S.r.word);
  assert('[bonus] correct idx found',correctIdx>=0);
  const normCorrect=norm(choices[correctIdx])===norm(S.r.word);
  assert('[bonus] norm match for correct choice',normCorrect);

  /* ── SUITE 6: football — intrus sees no player name ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId='football';S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  for(let i=0;i<20;i++){
    newRound();
    assert('[⚽ '+i+'] football flag',S.r.football===true);
    assert('[⚽ '+i+'] word is valid player',validWords.includes(S.r.word),S.r.word);
    assert('[⚽ '+i+'] close is null',S.r.close===null||S.r.close===undefined);
  }

  restore();

  const total=failures.length+
    ITER*6+       /* suite 1 */
    18+           /* suite 2 */
    S.players.length*2+ /* suite 3 (after restore players may differ, use rough count) */
    6+            /* suite 4 */
    5+            /* suite 5 */
    20*3;         /* suite 6 */

  if(failures.length){
    console.error('%c🧪 Game Tests: FAILED ('+failures.length+' failures)',
      'color:#FF4500;font-weight:bold;font-size:14px');
    console.group('Failures:');
    failures.forEach(f=>console.error('  ✗ '+f));
    console.groupEnd();
  } else {
    console.log('%c🧪 Game Tests: ALL PASSED ✅',
      'color:#2EFFA8;font-weight:bold;font-size:14px');
  }
  return {failed:failures.length,failures};
}
setTimeout(runGameTests,0);

/* ══════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════ */
render();
</script>
