<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>برا السالفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --night:#120D1F;
  --raise:#1E1530;
  --card:#261C3A;
  --edge:#3A2860;
  --flame:#FF4500;
  --fire2:#FF8C00;
  --saffron:#FFC43D;
  --mint:#2EFFA8;
  --chalk:#F6EFE6;
  --dim:#9B8BBF;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--night);
  color:var(--chalk);
  font-family:'Cairo',system-ui,sans-serif;
  display:flex;justify-content:center;
  overscroll-behavior:none;
}
#app{
  width:100%;max-width:460px;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  position:relative;z-index:1;
}
.screen{flex:1;display:flex;flex-direction:column;gap:16px}
.spacer{flex:1}

/* ─── TYPOGRAPHY ─────────────────────────────────────────── */
h1{font-size:clamp(40px,13vw,62px);font-weight:900;line-height:1;letter-spacing:-1px}
h2{font-size:24px;font-weight:800;line-height:1.2}
h3{font-size:18px;font-weight:700}
p{font-size:15px;line-height:1.7;color:var(--dim)}
.lead{color:var(--chalk)}
.sm{font-size:13px}

/* ─── DECORATIONS ────────────────────────────────────────── */
.zig{
  height:9px;
  background-image:
    linear-gradient(135deg,var(--flame) 25%,transparent 25%),
    linear-gradient(225deg,var(--flame) 25%,transparent 25%);
  background-size:16px 9px;
  border-radius:3px;opacity:.6;
}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);font-weight:700}
.bar b{color:var(--saffron);font-weight:900}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 12px;border-radius:99px;
  background:var(--edge);color:var(--saffron);
}

/* ─── BUTTONS ────────────────────────────────────────────── */
button{
  font-family:inherit;font-size:17px;font-weight:800;
  border:0;border-radius:var(--r);padding:16px 20px;
  cursor:pointer;width:100%;
  transition:transform .1s,box-shadow .1s;
  position:relative;overflow:hidden;
}
button::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 60%);
  pointer-events:none;
}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
button[disabled]{opacity:.3;cursor:not-allowed;transform:none}

.btn-primary{
  background:linear-gradient(135deg,var(--flame),var(--fire2));
  color:#fff;
  box-shadow:0 6px 24px rgba(255,69,0,.45);
}
.btn-cta{
  background:linear-gradient(135deg,var(--saffron),#FFB300);
  color:#120D1F;
  box-shadow:0 6px 24px rgba(255,196,61,.4);
  font-size:19px;
  padding:19px 20px;
}
.btn-ghost{
  background:transparent;color:var(--chalk);
  border:2px solid var(--edge);
}
.btn-ghost:hover{border-color:var(--dim)}
.btn-sm{font-size:14px;padding:11px 14px}
.row{display:flex;gap:10px}
.row button{flex:1}

/* ─── INPUTS ─────────────────────────────────────────────── */
input{
  width:100%;font-family:inherit;font-size:17px;font-weight:700;
  padding:14px 16px;border-radius:14px;
  border:2px solid var(--edge);
  background:var(--card);color:var(--chalk);
  transition:border-color .15s;
}
input:focus{outline:0;border-color:var(--saffron)}
input::placeholder{color:var(--dim);font-weight:600}

/* ─── CARDS / PICKS ──────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--edge);
  border-radius:var(--r);padding:18px;
}
.pick{
  width:100%;text-align:right;
  background:var(--card);border:2px solid var(--edge);
  border-radius:14px;padding:14px 16px;
  color:var(--chalk);font-size:16px;font-weight:700;
  cursor:pointer;transition:border-color .15s,background .15s;
  margin-bottom:8px;
}
.pick:hover{border-color:var(--dim)}
.pick.on{border-color:var(--saffron);background:rgba(255,196,61,.08)}
.pick .sub{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:3px}

/* ─── HOLD-TO-REVEAL ─────────────────────────────────────── */
.hold{
  position:relative;flex:1;min-height:280px;
  border-radius:26px;border:2px dashed var(--edge);
  background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:26px;
  touch-action:none;user-select:none;
  transition:border-color .25s,background .25s;
}
.hold.live{border-style:solid;border-color:var(--flame);background:rgba(255,69,0,.07)}
.hold .hint{font-size:15px;font-weight:700;color:var(--dim)}
.ring{
  width:88px;height:88px;border-radius:50%;
  background:conic-gradient(var(--flame) calc(var(--p)*1%),var(--edge) 0);
  display:grid;place-items:center;
  transition:none;
}
.ring-inner{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px}
.secret{display:none}
.hold.live .secret{display:block}
.hold.live .veil{display:none}
.role-badge{
  font-size:13px;font-weight:900;letter-spacing:1.5px;
  padding:5px 14px;border-radius:99px;margin-bottom:4px;
  display:inline-block;
}
.role-intrus{background:rgba(255,69,0,.2);color:var(--flame)}
.role-safe{background:rgba(46,255,168,.12);color:var(--mint)}
.word-reveal{font-size:clamp(36px,11vw,52px);font-weight:900;margin:6px 0 10px;line-height:1.1}
.mission-txt{font-size:15px;font-weight:700;color:var(--saffron);line-height:1.6;
  background:rgba(255,196,61,.08);border:1px solid rgba(255,196,61,.2);
  border-radius:12px;padding:12px;margin-top:8px}

/* ─── TABLE ──────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
td{padding:12px 4px;border-bottom:1px solid var(--edge);font-weight:700;font-size:16px}
td.pts{text-align:left;color:var(--saffron);font-weight:900;font-variant-numeric:tabular-nums;font-size:18px}
tr.winner td:first-child::before{content:'🥇 '}
tr.me td{color:var(--flame)}

/* ─── ANIMATIONS ─────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes glow{0%,100%{box-shadow:0 0 12px rgba(255,69,0,.3)}50%{box-shadow:0 0 28px rgba(255,69,0,.7)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes countPulse{0%{transform:scale(1)}50%{transform:scale(1.35);color:var(--flame)}100%{transform:scale(1)}}

.anim-fadeup{animation:fadeUp .4s ease both}
.anim-pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.anim-shake{animation:shake .5s ease}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}

/* ─── HOME SCREEN ────────────────────────────────────────── */
.home-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
.home-bg span{
  position:absolute;font-size:32px;
  animation:float 3s ease-in-out infinite;
  opacity:.18;
}
.home-logo{
  font-size:clamp(64px,20vw,90px);
  font-weight:900;line-height:.95;
  background:linear-gradient(135deg,#fff 30%,var(--saffron));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.home-sub{
  font-size:clamp(14px,4vw,18px);
  color:var(--dim);font-weight:600;letter-spacing:.5px;
}
.home-badge{
  display:flex;gap:10px;flex-wrap:wrap;
}
.home-pill{
  font-size:13px;font-weight:800;padding:6px 14px;
  border-radius:99px;border:1.5px solid var(--edge);
  color:var(--dim);
}

/* ─── HOW-TO ─────────────────────────────────────────────── */
.step{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--card);border-radius:14px;padding:14px;
}
.step-num{
  min-width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--flame),var(--fire2));
  display:grid;place-items:center;
  font-size:15px;font-weight:900;color:#fff;flex-shrink:0;
}

/* ─── TIMER ──────────────────────────────────────────────── */
.clock-big{
  font-size:clamp(72px,22vw,100px);font-weight:900;
  text-align:center;font-variant-numeric:tabular-nums;
  transition:color .3s;
}
.clock-big.low{color:var(--flame);animation:pulse 1s infinite}
.clock-sm{font-size:15px;font-variant-numeric:tabular-nums;color:var(--dim)}
.clock-sm.low{color:var(--flame);font-weight:800}

/* ─── RESULT ─────────────────────────────────────────────── */
.result-banner{
  border-radius:22px;padding:24px;text-align:center;
  border:2px solid;
}
.result-caught{background:rgba(46,255,168,.07);border-color:var(--mint)}
.result-escaped{background:rgba(255,69,0,.07);border-color:var(--flame)}

/* ─── FOOTBALL THEME ────────────────────────────────────── */
.football-edition{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:900;letter-spacing:.5px;
  padding:4px 12px;border-radius:99px;margin-bottom:6px;
  background:rgba(27,107,46,.25);color:#4CAF50;
  border:1px solid rgba(76,175,80,.35);
}
.word-football{color:#4CAF50;text-shadow:0 2px 14px rgba(76,175,80,.35)}
.word-outsider-football{
  color:var(--flame);
  font-size:clamp(26px,7vw,38px)!important;
  line-height:1.25;
}
.football-cat-btn{border-color:rgba(76,175,80,.35)!important}
.football-cat-btn.on{border-color:#4CAF50!important;background:rgba(76,175,80,.1)!important}

/* ─── CONFETTI ───────────────────────────────────────────── */
.confetti-piece{
  position:fixed;top:-20px;
  width:10px;height:14px;border-radius:3px;
  pointer-events:none;z-index:9999;
  animation:confettiFall linear both;
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ══════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════ */
const norm = s => (s||'').toString().trim().toLowerCase()
  .replace(/[ً-ْـ]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .replace(/^ال/,'').replace(/\s+/g,' ');

const pick   = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => {
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
};
const fmt = s => Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════════════════════════════════════════════════════
   ENGINE
══════════════════════════════════════════════════════════ */
function chooseIntrus(){
  const recent = S.intrusHistory.slice(-2);
  let pool = S.players.filter(p=>!recent.includes(p));
  if(!pool.length) pool = S.players.filter(p=>p!==S.intrusHistory.slice(-1)[0]);
  if(!pool.length) pool = [...S.players];
  return pick(pool);
}

function drawChaos(){
  const last2 = S.chaosHistory.slice(-2);
  let pool = CHAOS.filter(c=>!c.mp||S.players.length>=c.mp);
  if(last2.length===2 && last2.every(b=>b==='intrus')) pool = pool.filter(c=>c.b!=='intrus');
  const c = pick(pool);
  S.chaosHistory.push(c.b);
  return c;
}

function newRound(){
  const cat = CATS.find(c=>c.id===S.catId) || pick(CATS);
  const entry = pick(cat.w);
  const [word, close, ok] = entry;
  const intrus = chooseIntrus();
  S.intrusHistory.push(intrus);

  const trio = S.players.length === 3;
  const closeMode = trio ? true : (S.mode!=='classic' && Math.random()<.55);
  const chaos = (S.mode==='hybrid') ? drawChaos() : null;

  let missions = {};
  if(S.mode==='hybrid' && !trio){
    const avail = shuffle(MISSIONS.filter(m=>!chaos||!m.c.includes(chaos.id)));
    S.players.forEach((p,i) => missions[p] = avail[i%avail.length]);
  }

  S.r = {
    cat:cat.n, word, close, ok, intrus, closeMode, chaos, missions, trio,
    football:!!cat.football,
    asker:pick(S.players), lastAsker:null, turns:0, asked:{},
    votes:{}, caught:false, guess:null, judged:{}, tied:[],
  };
  S.idx = 0; S.tieRound = false;
  S.round++;
}

function tallyVotes(votes){
  const t={};
  S.players.forEach(p=>t[p]=0);
  Object.values(votes).forEach(v=>t[v]++);
  const max = Math.max(...Object.values(t));
  return {t, top:S.players.filter(p=>t[p]===max), max};
}

function calcScore(){
  const r=S.r, add={};
  S.players.forEach(p=>add[p]=0);
  if(r.caught){
    S.players.filter(p=>p!==r.intrus).forEach(p=>{ add[p]=(r.votes[p]===r.intrus)?2:1; });
    if(r.guess===true) add[r.intrus]=4;
  } else {
    add[r.intrus]=3;
  }
  Object.entries(r.judged).forEach(([p,ok])=>{ if(ok) add[p]+=2; });
  S.players.forEach(p=>S.scores[p]=(S.scores[p]||0)+add[p]);
  return add;
}

function confetti(count=60){
  const colors=['#FF4500','#FFC43D','#2EFFA8','#FF69B4','#00BFFF','#FFD700'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`
      left:${Math.random()*100}vw;
      background:${pick(colors)};
      width:${6+Math.random()*10}px;
      height:${10+Math.random()*10}px;
      border-radius:${Math.random()>0.5?'50%':'3px'};
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*.8}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

/* floating bg emojis on home */
function buildHomeBg(){
  const bg=document.getElementById('homeBg'); if(!bg)return;
  bg.innerHTML='';
  const emojis=['🎭','🔥','😂','🃏','🎲','💥','👀','🤫','🕵️','😈','🤡','💀'];
  emojis.forEach((e,i)=>{
    const s=document.createElement('span');
    s.textContent=e;
    s.style.cssText=`
      left:${5+Math.random()*90}%;top:${5+Math.random()*90}%;
      animation-delay:${i*0.4}s;animation-duration:${3+Math.random()*2}s;
      font-size:${24+Math.random()*28}px;
    `;
    bg.appendChild(s);
  });
}

══════════════════════════════════════════════════════════ */
let clk=null;
function startClock(sec){
  stopClock(); S.clockLeft=sec; S.clockDone=false;
  const paint=()=>{
    const el=document.getElementById('clock-el'); if(!el)return;
    el.textContent=fmt(S.clockLeft);
    el.className='clock-sm'+(S.clockLeft<=20?' low':'');
  };
  paint();
  clk=setInterval(()=>{
    S.clockLeft--;
    if(S.clockLeft<=0){S.clockLeft=0;S.clockDone=true;stopClock();render();return;}
    paint();
  },1000);
}
function stopClock(){clearInterval(clk);clk=null;}

  <button class="btn-cta anim-fadeup" onclick="act.start()">يالله نبداو! 🚀</button>`,

/* ── PASS PHONE ────────────────────────────────────────────── */
pass: ()=>`
  ${hdr()}
  <div class="spacer"></div>
  <div style="text-align:center" class="anim-fadeup">
    <div style="font-size:48px">📱</div>
    <p style="margin-top:8px">عطي الطيليفون لـ</p>
    <h1 style="font-size:46px;margin:8px 0">${esc(S.players[S.idx])}</h1>
    <p class="sm">ما تشوفش الشاشة إلا ماشي نوبتك</p>
  </div>
  <div class="spacer"></div>
  <button class="btn-cta" onclick="act.toReveal()">أنا هو ${esc(S.players[S.idx])} ✋</button>`,

/* ── REVEAL ────────────────────────────────────────────────── */
reveal: ()=>{
  const p=S.players[S.idx], r=S.r, isI=(p===r.intrus);
  const footballOutsider = r.football && isI;
  const word = footballOutsider ? 'نتا برا السالفة'
    : isI ? (r.closeMode?r.close:'؟؟؟')
    : r.word;
  const wordClass = footballOutsider ? 'word-reveal word-outsider-football'
    : (r.football && !isI) ? 'word-reveal word-football'
    : 'word-reveal';
  const subtext = footballOutsider ? ''
    : isI ? (r.closeMode?'الكلمة ديالك ماشي هي ديال الناس — حاول تلقاها 🎯':'ما عندك حتى كلمة — مثّل مزيان 🎭')
    : r.football ? 'هداك اللاعب هو السر — عطي indice بلا ما تفضح 🤫'
    : 'عطي indice بلا ما تفضح الكلمة 🤫';
  const m = footballOutsider ? null : r.missions[p];
  return `
  ${hdr()}
  <div class="hold" id="hold" style="--p:0">
    <div class="veil" style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div class="ring" id="ring">
        <div class="ring-inner">🔒</div>
      </div>
      <div class="hint">شد بصبعك باش تشوف</div>
      <p class="sm">كيتخبى ملي تقلع صبعك</p>
    </div>
    <div class="secret">
      ${r.football?'<span class="football-edition">⚽ Football Edition</span>':''}
      <span class="role-badge ${isI?'role-intrus':'role-safe'}">
        ${isI?'🕵️ برا السالفة':'✅ فالسالفة'}
      </span>
      <div class="${wordClass}">${esc(word)}</div>
      ${subtext?`<p style="font-size:13px;color:var(--dim)">${subtext}</p>`:''}
      ${m?`<div class="mission-txt">🎯 مهمتك<br>${esc(m.t)}</div>`:''}
    </div>
  </div>
  <button class="btn-ghost" onclick="act.nextReveal()">شفت — التالي →</button>`;
},

/* ── CHAOS ─────────────────────────────────────────────────── */
chaos: ()=>{
  const c=S.r.chaos;
  return `
  ${hdr()}
  <div class="spacer"></div>
  <div style="text-align:center" class="anim-pop">
    <span class="tag" style="font-size:14px;padding:8px 18px">⚡ CHAOS CARD</span>
    <h2 style="margin:16px 0 10px;font-size:32px">${esc(c.t)}</h2>
    <p class="lead" style="font-size:17px;margin-bottom:12px">${esc(c.d)}</p>
    <p class="sm">هاد القاعدة كتطبق على الجميع — حتى على برا السالفة</p>
  </div>
  <div class="spacer"></div>
  <button class="btn-primary" onclick="act.discuss()">فهمنا — نبداو! 🔥</button>`;
},

/* ── CHAIN (DISCUSSION) ────────────────────────────────────── */
chain: ()=>{
  const r=S.r, me=r.asker;
  const ban = S.players.length>3 ? r.lastAsker : null;
  const minT = S.players.length;
  const ready = r.turns>=minT || S.clockDone;
  const opts = S.players.map((p,i)=>[p,i]).filter(([p])=>p!==me&&p!==ban);
  return `
  ${hdr()}
  ${r.chaos?`
  <div class="card" style="padding:11px 14px;border-color:var(--flame)">
    <span class="tag" style="font-size:10px">⚡ CHAOS</span>
    <b style="font-size:14px;margin-right:8px">${esc(r.chaos.t)}</b>
    <p style="font-size:12px;margin-top:4px">${esc(r.chaos.d)}</p>
  </div>`:''}
  <div class="bar">
    <span>السؤال رقم <b>${r.turns+1}</b></span>
    <span id="clock-el" class="clock-sm${S.clockLeft<=20?' low':''}">${fmt(S.clockLeft)}</span>
  </div>
  <div style="text-align:center;padding:8px 0" class="anim-fadeup">
    <p style="font-size:14px;color:var(--dim)">دابا كيسول</p>
    <h2 style="font-size:36px">${esc(me)}</h2>
    <p class="sm" style="margin-top:4px">سول شي واحد. من بعد ما يجاوب، هو اللي غادي يسول.</p>
  </div>
  ${opts.map(([p,i])=>`
  <button class="pick anim-fadeup" onclick="act.ask(${i})">
    ${esc(p)}
    <span class="sub">${r.asked[p]?`تسال ${r.asked[p]} مرات`:'مازال ما تسال'}</span>
  </button>`).join('')}
  <div class="spacer"></div>
  <button class="${ready?'btn-primary':'btn-ghost'}" onclick="act.toVote()" ${ready?'':'disabled'}>
    ${ready?'نصوتو دابا 🗳️':`نصوتو (باقي ${minT-r.turns} أسئلة)`}
  </button>`;
},

/* ── VOTE PASS ─────────────────────────────────────────────── */
votepass: ()=>`
  ${hdr()}
  <div class="spacer"></div>
  <div style="text-align:center" class="anim-fadeup">
    <div style="font-size:42px">🗳️</div>
    <p style="margin-top:8px">${S.tieRound?'⚡ إعادة التصويت! عطي الطيليفون لـ':'عطي الطيليفون لـ'}</p>
    <h1 style="font-size:44px;margin:8px 0">${esc(S.players[S.idx])}</h1>
  </div>
  <div class="spacer"></div>
  <button class="btn-cta" onclick="act.toCast()">أنا واجد ✋</button>`,

/* ── CAST VOTE ─────────────────────────────────────────────── */
cast: ()=>{
  const me=S.players[S.idx];
  const pool=S.tieRound?S.r.tied:S.players;
  const opts=S.players.map((p,i)=>[p,i]).filter(([p])=>p!==me&&pool.includes(p));
  return `
  ${hdr()}
  <h2 class="anim-fadeup">🕵️ شكون برا السالفة؟</h2>
  ${opts.map(([p,i])=>`
  <button class="pick anim-fadeup" onclick="act.vote(${i})">
    ${esc(p)}
    <span class="sub">${S.r.asked[p]?`تسال ${S.r.asked[p]} مرات`:'ما تسال حتى مرة'}</span>
  </button>`).join('')}
  ${!opts.length?`
  <p>ما عندكش على من تصوت فهاد الدورة.</p>
  <button class="btn-ghost" onclick="act.vote(-1)">تجاوز</button>`:''}`;
},

/* ── JUDGE MISSION ─────────────────────────────────────────── */
judge: ()=>{
  const p=S.players[S.idx], m=S.r.missions[p];
  return `
  ${hdr()}
  <div style="text-align:center" class="anim-fadeup">
    <p>المهمة السرية ديال</p>
    <h2 style="font-size:30px;margin:8px 0">${esc(p)}</h2>
    <div class="mission-txt" style="font-size:18px;text-align:center">${esc(m.t)}</div>
    <p style="margin-top:12px" class="sm">المجموعة تقرر: واش دارها؟ (${esc(p)} ما كيصوتش)</p>
  </div>
  <div class="spacer"></div>
  <div class="row">
    <button class="btn-ghost" onclick="act.judge(false)">❌ لا</button>
    <button class="btn-cta" onclick="act.judge(true)">✅ إيه، دارها</button>
  </div>`;
},

/* ── BONUS GUESS ───────────────────────────────────────────── */
bonus: ()=>`
  ${hdr()}
  <div class="spacer"></div>
  <div style="text-align:center" class="anim-pop">
    <div style="font-size:48px">🎯</div>
    <span class="tag" style="margin:8px 0;display:inline-block">فرصة أخيرة</span>
    <h2 style="margin-top:10px">${esc(S.r.intrus)}، تصابتي 😅</h2>
    <p class="lead" style="margin-top:8px">إلا خمنتي الكلمة ديال الناس، كتربح 4 نقط!</p>
  </div>
  <input id="g" placeholder="اكتب الكلمة هنا..." autofocus>
  <div class="spacer"></div>
  <button class="btn-primary" onclick="act.guess()">هادي هي! 🔥</button>
  <button class="btn-ghost btn-sm" onclick="act.skipGuess()">ما عرفتش 😔</button>`,

/* ── RESULT ────────────────────────────────────────────────── */
result: ()=>{
  const r=S.r, add=r.add;
  const caught=r.caught;
  return `
  ${hdr()}
  <div class="result-banner ${caught?'result-caught':'result-escaped'} anim-pop">
    <div style="font-size:52px">${caught?'🎉':'😈'}</div>
    <h1 style="font-size:42px;color:${caught?'var(--mint)':'var(--flame)'};margin:8px 0">
      ${caught?'تصاب!':'فلت!'}
    </h1>
    <p class="lead" style="font-size:16px">
      برا السالفة كان <b style="color:var(--saffron)">${esc(r.intrus)}</b><br>
      الكلمة كانت <b style="color:var(--saffron)">${esc(r.word)}</b>
    </p>
    ${r.guess===true?'<p style="color:var(--mint);font-weight:800;margin-top:8px">وخمن الكلمة صحيحة! +4 🔮</p>':''}
    ${r.guess===false?'<p style="color:var(--flame);margin-top:8px">وما عرفش يخمن 😅</p>':''}
  </div>
  <table class="anim-fadeup d2">
    ${S.players.map(p=>`
    <tr class="${p===r.intrus?'me':''}">
      <td>${esc(p)}${p===r.intrus?' 🕵️':''}</td>
      <td class="pts">+${add[p]} نقطة</td>
    </tr>`).join('')}
  </table>
  <div class="spacer"></div>
  <button class="btn-cta anim-fadeup d3" onclick="act.board()">النقاط →</button>`;
},

/* ── SCOREBOARD ────────────────────────────────────────────── */
board: ()=>{
  const sorted=[...S.players].sort((a,b)=>S.scores[b]-S.scores[a]);
  const done=S.round>=ROUNDS;
  if(done) confetti(80);
  return `
  <div class="bar anim-fadeup">
    <span>${done?'🏆 النتيجة النهائية':'📊 النقاط'}</span>
    <span>الجولة <b>${S.round}</b>/${ROUNDS}</span>
  </div>
  <div class="zig"></div>
  ${done?`<h1 class="anim-pop" style="font-size:34px;text-align:center;margin:8px 0">
    🥇 ${esc(sorted[0])} ربح!
  </h1>`:''}
  <table class="anim-fadeup d2">
    ${sorted.map((p,i)=>`
    <tr class="${i===0&&done?'winner':''}">
      <td>${['🥇','🥈','🥉'][i]||'  '} ${esc(p)}</td>
      <td class="pts">${S.scores[p]}</td>
    </tr>`).join('')}
  </table>
  <div class="spacer"></div>
  ${done?`
  <button class="btn-cta anim-fadeup d3" onclick="act.again()">🔄 عاود من الأول</button>
  <button class="btn-ghost anim-fadeup d4" onclick="go('home')">🏠 الصفحة الرئيسية</button>`
  :`<button class="btn-primary anim-fadeup d3" onclick="act.start()">الجولة اللي جاية ⚡</button>`}`;
},
}; // end VIEWS

/* ══════════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════════ */
act.setup = ()=>{ if(!S.players.length) S.players=['','',''];  go('setup'); };
act.more  = ()=>{ const c=grab(); if(c.length<8){S.players=[...c,'']; render();} };
act.less  = ()=>{ const c=grab(); if(c.length>3){S.players=c.slice(0,-1); render();} };

function grab(){ return Array.from(app.querySelectorAll('#names input')).map(i=>i.value); }

act.names = ()=>{
  const v = grab().map((s,i)=>s.trim()||`لاعب ${i+1}`);
  if(new Set(v).size!==v.length){ alert('السميات خاصهم يكونو مختلفين 😅'); return; }
  S.players=v; S.players.forEach(p=>S.scores[p]=0); go('config');
};
act.mode = m  => { S.mode=m; render(); };
act.cat  = c  => { S.catId=c; render(); };

act.start = ()=>{
  if(S.round>=ROUNDS){ act.again(); return; }
  newRound(); go('pass');
};

act.toReveal  = ()=>{ go('reveal'); bindHold(); };
act.nextReveal = ()=>{
  S.idx++;
  if(S.idx<S.players.length){ go('pass'); }
  else{ S.idx=0; S.r.chaos ? go('chaos') : act.discuss(); }
};
act.discuss = ()=>{ go('chain'); startClock(S.r.trio?180:240); };
act.ask = i =>{
  const target=S.players[i], r=S.r;
  r.asked[target]=(r.asked[target]||0)+1;
  r.lastAsker=r.asker; r.asker=target; r.turns++;
  render();
};
act.toVote = ()=>{ stopClock(); S.idx=0; S.r.votes={}; go('votepass'); };
act.toCast = ()=> go('cast');
act.vote = i =>{
  if(i>=0) S.r.votes[S.players[S.idx]]=S.players[i];
  S.idx++;
  if(S.idx<S.players.length){ go('votepass'); return; }
  finishVote();
};

function finishVote(){
  if(S.r.trio){
    const inn = S.players.filter(p=>p!==S.r.intrus);
    S.r.caught = inn.every(p=>S.r.votes[p]===S.r.intrus);
    S.idx=0; afterJudge(); return;
  }
  const {top} = tallyVotes(S.r.votes);
  if(top.length>1 && !S.tieRound){
    S.r.tied=top; S.tieRound=true; S.idx=0; S.r.votes={};
    alert('تعادل! ⚡ إعادة التصويت بين: '+top.join('، '));
    go('votepass'); return;
  }
  S.r.caught = top.length===1 && top[0]===S.r.intrus;
  S.idx=0;
  const hasMissions = Object.keys(S.r.missions).length>0;
  if(hasMissions) go('judge'); else afterJudge();
}

act.judge = ok =>{
  S.r.judged[S.players[S.idx]]=ok;
  S.idx++;
  if(S.idx<S.players.length) go('judge'); else afterJudge();
};
function afterJudge(){ if(S.r.caught) go('bonus'); else finish(); }

act.guess = ()=>{
  const v = norm(document.getElementById('g').value); if(!v) return;
  S.r.guess = S.r.ok.some(a=>norm(a)===v) || norm(S.r.word)===v;
  finish();
};
act.skipGuess = ()=>{ S.r.guess=false; finish(); };

function finish(){ S.r.add=calcScore(); go('result'); }
act.board = ()=> go('board');
act.again = ()=>{
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[];
  S.players.forEach(p=>S.scores[p]=0);
  act.start();
};

/* ══════════════════════════════════════════════════════════
   HOLD TO REVEAL
══════════════════════════════════════════════════════════ */
function bindHold(){
  const el=document.getElementById('hold'); if(!el) return;
  let t=null, p=0;
  const up = ()=>{
    clearInterval(t); p=0;
    el.style.setProperty('--p',0);
    el.classList.remove('live');
    const ri=document.getElementById('ring');
    if(ri) ri.querySelector('.ring-inner').textContent='🔒';
  };
  const down = e=>{
    e.preventDefault(); clearInterval(t);
    t=setInterval(()=>{
      p=Math.min(100,p+16);
      el.style.setProperty('--p',p);
      const ri=document.getElementById('ring');
      if(ri) ri.querySelector('.ring-inner').textContent=p>=100?'👁️':'🔓';
      if(p>=100) el.classList.add('live');
    },40);
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden && S.phase==='reveal'){
    const el=document.getElementById('hold');
    if(el){ el.classList.remove('live'); el.style.setProperty('--p',0); }
  }
});

/* ══════════════════════════════════════════════════════════
   FOOTBALL CATEGORY TESTS
   Run: runFootballTests() in the browser console
   Auto-runs on load and logs results to console
══════════════════════════════════════════════════════════ */
function runFootballTests(){
  const failures=[];
  const assert=(name,cond,detail)=>{if(!cond)failures.push(name+(detail?': '+detail:''));};

  /* save state */
  const sv={
    players:[...S.players],catId:S.catId,mode:S.mode,round:S.round,
    intrusHistory:[...S.intrusHistory],chaosHistory:[...S.chaosHistory],
    scores:{...S.scores},r:S.r
  };

  /* setup isolated test context */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId='football'; S.mode='classic'; S.round=0;
  S.intrusHistory=[]; S.chaosHistory=[];

  const footballCat=CATS.find(c=>c.id==='football');
  const validWords=footballCat.w.map(e=>e[0]);
  const ITER=30;

  for(let i=0;i<ITER;i++){
    newRound();
    const r=S.r;

    /* 1. football flag set on round object */
    assert('['+i+'] football flag',r.football===true,'r.football should be true');

    /* 2. exactly one outsider (برا السالفة) */
    const outsiderCount=S.players.filter(p=>p===r.intrus).length;
    assert('['+i+'] one outsider',outsiderCount===1,'got '+outsiderCount);

    /* 3. word is a valid football player name */
    assert('['+i+'] word is player name',validWords.includes(r.word),'"'+r.word+'" not in list');

    /* 4. all regular players see the same word (r.word) — confirmed: non-outsider
          reveal uses r.word directly, so they all see the same value */
    const regularPlayers=S.players.filter(p=>p!==r.intrus);
    assert('['+i+'] regular players exist',regularPlayers.length>=1,'no regular players');

    /* 5. outsider reveal = "نتا برا السالفة" — simulate reveal view logic */
    const outsiderSees=r.football?'نتا برا السالفة':(r.closeMode?r.close:'؟؟؟');
    assert('['+i+'] outsider sees نتا برا السالفة',outsiderSees==='نتا برا السالفة','"'+outsiderSees+'"');

    /* 6. secret word NOT leaked — outsider sees different text from the word */
    assert('['+i+'] word not leaked',outsiderSees!==r.word,'leaked: "'+r.word+'"');

    /* 7. close word is null for football — no alternate name to leak */
    assert('['+i+'] close is null',r.close===null||r.close===undefined,'close="'+r.close+'"');
  }

  /* restore state */
  S.players=sv.players; S.catId=sv.catId; S.mode=sv.mode; S.round=sv.round;
  S.intrusHistory=sv.intrusHistory; S.chaosHistory=sv.chaosHistory;
  S.scores=sv.scores; S.r=sv.r;

  const total=ITER*7;
  const passed=total-failures.length;
  if(failures.length){
    console.error('%c⚽ Football Tests: '+passed+'/'+total+' passed — '+failures.length+' FAILED',
      'color:#FF4500;font-weight:bold;font-size:14px');
    console.group('Failures:');
    failures.forEach(f=>console.error('  ✗ '+f));
    console.groupEnd();
  } else {
    console.log('%c⚽ Football Tests: '+total+'/'+total+' passed ✅',
      'color:#2EFFA8;font-weight:bold;font-size:14px');
  }
  return {passed,failed:failures.length,failures};
}
setTimeout(runFootballTests,0);

/* ══════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════ */
render();
</script>
